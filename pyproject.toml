[project]
name = "lm-tuio-python"
version = "0.1.0"
description = "Remote LM Studio management TUI."
readme = "README.md"
authors = [{ name = "jpfife", email = "jpfife@redappr.com" }]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "rich-argparse>=1.8.0",
    "textual>=8.2.8",
    "tomlkit>=0.15.1",
]

[project.scripts]
lm-tuio = "lm_tuio.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "textual-dev>=1.8.0"]

[tool.pyright]
venvPath = '.'
venv = '.venv'

[tool.uv.build-backend]
module-name = 'lm_tuio'
